<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Routine</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #eee; padding: 16px; max-width: 520px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: #8a8f98; font-size: 14px; margin-bottom: 14px; }
  .bar { height: 10px; background: #222733; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #3ddc84; transition: width .3s; }
  .stats { display: flex; justify-content: space-between; font-size: 14px; margin: 8px 0 14px; color: #b5bac4; }
  .days { display: flex; gap: 6px; margin-bottom: 18px; }
  .dot { flex: 1; text-align: center; font-size: 11px; padding: 6px 0; border-radius: 8px; background: #1a1e27; color: #6b7280; }
  .dot.done { background: #1f7a4a; color: #fff; }
  .dot.today { outline: 2px solid #4f8cff; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8a8f98; margin: 18px 0 8px; }
  .task { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; margin-bottom: 8px; background: #1a1e27; border: 2px solid transparent; border-radius: 12px; color: inherit; font-size: 16px; text-align: left; cursor: pointer; }
  .task.done { background: #16301f; border-color: #2c8a52; }
  .task.done .label { text-decoration: line-through; opacity: .6; }
  .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #4a5160; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .done .check { background: #3ddc84; border-color: #3ddc84; color: #0f1115; font-weight: bold; }
  .label { flex: 1; }
  .note { display: block; font-size: 12px; color: #8a8f98; margin-top: 2px; }
  .cnt { font-size: 13px; color: #b5bac4; }
  .msg { text-align: center; margin-top: 16px; color: #3ddc84; font-weight: 600; min-height: 22px; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .pop { position: fixed; pointer-events: none; z-index: 60; font-weight: 800; font-size: 22px; color: #3ddc84; text-shadow: 0 2px 12px rgba(61,220,132,.6); animation: floatup 1s ease-out forwards; white-space: nowrap; }
  @keyframes floatup { to { transform: translateY(-90px) scale(1.3); opacity: 0; } }
  .flash { position: fixed; inset: 0; pointer-events: none; z-index: 40; background: radial-gradient(circle, rgba(61,220,132,.35), transparent 70%); animation: flashfade .6s ease-out forwards; }
  @keyframes flashfade { from { opacity: 1; } to { opacity: 0; } }
  .xp { font-size: 13px; color: #ffd166; margin: -6px 0 12px; }
  .hap { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .nav { display: inline-block; margin: 2px 0 10px; color: #4f8cff; font-size: 14px; text-decoration: none; }
</style>
</head>
<body>
<h1>🔥 Daily Routine</h1>
<a class="nav" href="meals.html">🍽️ Meals &amp; shopping</a>
<div class="sub" id="date"></div>
<div class="xp" id="xp"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="stats"><span id="progress"></span><span id="streak"></span></div>
<div class="days" id="days"></div>
<div id="list"></div>
<div class="msg" id="msg"></div>

<script>
// ===== EDIT YOUR ROUTINE HERE =====
// count: how many times per day (e.g. 4 for eye drops)
// days: optional, which weekdays (0=Sun ... 6=Sat). Leave out for every day.
const TASKS = [
  { id: 'drops',   group: '🔴 Eye care',  emoji: '💧', label: 'Steroid eye drops', count: 4, note: 'As prescribed, 4 times a day' },
  { id: 'heat',    group: '🔴 Eye care',  emoji: '🔥', label: 'Heat mask',         count: 2, note: 'Twice a day' },

  { id: 'cleanse', group: '🟢 Morning',   emoji: '🧴', label: 'Cleanser + moisturiser', count: 1 },
  { id: 'spf',     group: '🟢 Morning',   emoji: '☀️', label: 'SPF',                    count: 1 },
  { id: 'posture', group: '🟢 Morning',   emoji: '🧍', label: 'Posture check (chin tucked, shoulders back)', count: 1 },
  { id: 'water',   group: '🟢 Morning',   emoji: '🚰', label: 'Drink water through the day', count: 4, note: 'Tap each time you finish a bottle/glass' },

  { id: 'protein', group: '🟡 Fuel',      emoji: '🍗', label: 'Protein at each meal', count: 3 },

  { id: 'gym',     group: '🟡 Training',  emoji: '🏋️', label: 'Gym session (full body)', count: 1, days: [1,3,5] },

  { id: 'pm',      group: '🔵 Evening',   emoji: '🌙', label: 'Cleanser + moisturiser', count: 1 },
  { id: 'hair',    group: '🔵 Evening',   emoji: '💇', label: 'Wash/style hair as needed', count: 1 },
  { id: 'sleep',   group: '🔵 Evening',   emoji: '😴', label: 'In bed for 8+ hours of sleep', count: 1 },
];
// ===================================

const KEY = 'routine-v1';
const state = JSON.parse(localStorage.getItem(KEY) || '{}');
const fmt = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const tasksFor = d => TASKS.filter(t => !t.days || t.days.includes(d.getDay()));
const dayDone = d => { const s = state[fmt(d)] || {}; return tasksFor(d).every(t => (s[t.id]||0) >= t.count); };
const save = () => localStorage.setItem(KEY, JSON.stringify(state));

function toggle(id, count) {
  const today = new Date(), k = fmt(today);
  state[k] = state[k] || {};
  const n = state[k][id] || 0;
  const next = n >= count ? 0 : n + 1;
  state[k][id] = next;
  save(); render();
  if (next > n) {
    if (dayDone(today)) celebrate('mega', 'xp-' + k + '-day');
    else if (next >= count) celebrate('big', 'xp-' + k + '-' + id + '-done');
    else celebrate('small', 'xp-' + k + '-' + id + '-' + next);
  }
}

function render() {
  const today = new Date(), k = fmt(today);
  const s = state[k] || {};
  const tasks = tasksFor(today);

  document.getElementById('date').textContent = today.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });

  // list grouped
  const list = document.getElementById('list');
  list.innerHTML = '';
  let lastGroup = '';
  tasks.forEach(t => {
    if (t.group !== lastGroup) { const h = document.createElement('h2'); h.textContent = t.group; list.appendChild(h); lastGroup = t.group; }
    const n = s[t.id] || 0, done = n >= t.count;
    const b = document.createElement('button');
    b.className = 'task' + (done ? ' done' : '');
    b.innerHTML = '<span class="check">' + (done ? '✓' : '') + '</span>' +
      '<span class="label">' + t.emoji + ' ' + t.label + (t.note ? '<span class="note">' + t.note + '</span>' : '') + '</span>' +
      (t.count > 1 ? '<span class="cnt">' + n + '/' + t.count + '</span>' : '');
    b.onclick = () => toggle(t.id, t.count);
    list.appendChild(b);
  });

  // progress
  const total = tasks.reduce((a,t) => a + t.count, 0);
  const got = tasks.reduce((a,t) => a + Math.min(s[t.id]||0, t.count), 0);
  const pct = total ? Math.round(got/total*100) : 0;
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('progress').textContent = pct + '% done today';

  // streak
  let streak = 0, d = new Date();
  if (!dayDone(d)) d.setDate(d.getDate()-1);
  while (dayDone(d) && streak < 1000) { streak++; d.setDate(d.getDate()-1); }
  document.getElementById('streak').textContent = '🔥 ' + streak + ' day streak';

  // last 7 days
  const days = document.getElementById('days');
  days.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const x = new Date(); x.setDate(x.getDate()-i);
    const el = document.createElement('div');
    el.className = 'dot' + (dayDone(x) ? ' done' : '') + (i === 0 ? ' today' : '');
    el.textContent = x.to
